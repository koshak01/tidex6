# tidex6-wusdc-cli
#
# Stealth demo CLI (send / collect / audit) — thin wrappers over
# tidex6-client::confidential (same path as local MCP).
# Legacy bins: init / deposit / withdraw (verify-only pool tree).

[package]
name = "tidex6-wusdc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anchor-client = { workspace = true }
anchor-lang = { workspace = true }
tidex6-wusdc-pool = { path = "../../programs/tidex6-wusdc-pool", features = ["no-entrypoint", "cpi"] }
tidex6-core = { path = "../tidex6-core" }
tidex6-circuits = { path = "../tidex6-circuits" }
tidex6-indexer = { path = "../tidex6-indexer" }
# Скан конвертов и забор stealth-ноты — та же библиотека, что у MCP и у сайта.
tidex6-client = { path = "../tidex6-client" }
anyhow = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-keypair = "3"
solana-pubkey = "3"
solana-rpc-client = "3"
toml = "0.9"
ark-bn254 = { workspace = true }
ark-groth16 = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
solana-signature = "3"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
