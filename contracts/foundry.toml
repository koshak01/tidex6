[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Whitechain Sepolia — the target network for the first EVM deployment.
# Chain ID 1874, OP Stack, Cancun EVM, WBT as the gas token.
[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

[etherscan]
whitechain_sepolia = { key = "unused", url = "https://explorer.testnet.whitechain.io/api", chain = 1874 }
