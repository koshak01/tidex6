[package]
name = "tidex6-client"
description = "tidex6 Rust SDK: high-level PrivatePool builder API for shielded deposits and withdrawals on Solana."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tidex6-core = { version = "2.18.0", path = "../tidex6-core" }
tidex6-circuits = { version = "2.18.0", path = "../tidex6-circuits" }
tidex6-indexer = { version = "2.18.0", path = "../tidex6-indexer" }
tidex6-verifier-v2 = { version = "2.18.0", path = "../../programs/tidex6-verifier-v2", features = ["no-entrypoint"] }
tidex6-registry = { version = "2.18.0", path = "../../programs/tidex6-registry", features = ["no-entrypoint"] }
tidex6-pool-v2 = { version = "2.18.0", path = "../../programs/tidex6-pool-v2", features = ["no-entrypoint"] }
# Pool v2 state is zero-copy: read it as plain bytes.
bytemuck = "1"
tidex6-confidential = { version = "2.18.0", path = "../tidex6-confidential" }

anchor-client = { workspace = true }
anyhow = { workspace = true }
# Отказ лимита — штатный ответ, а не сбой: у него есть тип и разбираемые
# варианты, чтобы вызывающий мог отличить «превышен потолок» от «нет сети».
thiserror = { workspace = true }

ark-bn254 = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
ark-ff = { workspace = true }
ark-std = "0.5"

solana-keypair = "3"
solana-rpc-client = "3"
solana-rpc-client-api = "3"
solana-account-decoder-client-types = "3"
solana-signature = "3"
# Перевод оператору собирается вручную из трёх инструкций — нужен сам тип
# транзакции. (`solana-transaction-status` ниже — про чтение чужих, не путать.)
solana-transaction = "3"
solana-compute-budget-interface = "3"
solana-transaction-status = "3"

# ADR-011: via_relayer path posts the proof to an HTTP endpoint
# instead of signing the tx locally. reqwest::blocking keeps the
# synchronous API of WithdrawBuilder consistent — no runtime plumbing
# leaks into callers. rustls-tls avoids pulling in OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Дискриминатор anchor-аккаунта — sha256 от имени типа. Тот же путь, что
# у ct-lab, чтобы два места считали одно и то же одинаково.
sha2 = "0.10"
hex = "0.4"
base64 = { workspace = true }
# ark-groth16 default features pull rayon; long-lived hosts must pin the pool
# (see confidential::init_prover_runtime).
rayon = "1"
# Proofs run with tracing off (prover_runtime::without_tracing).
tracing = "0.1"
# EVM: подпись и кодирование транзакции своим ключом (`evm::rpc`). Без
# провайдера и async — узел спрашивается блокирующим reqwest, как везде здесь.
alloy = { version = "2.4", default-features = false, features = ["std", "consensus", "eips", "signer-local"] }
# Случайность доказательства вывода — ОС, как у релеера и браузера.
rand = "0.8"

[lints]
workspace = true
