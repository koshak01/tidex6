[package]
name = "tidex6-mcp-local"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "tidex6 MCP server for a local signer: the agent pays with its own key, no browser"
readme = "README.md"

[dependencies]
tidex6-client = { version = "2.17.1", path = "../tidex6-client" }
tidex6-core = { version = "2.17.1", path = "../tidex6-core" }

anyhow = { workspace = true }
# `transport-io` даёт stdio: MCP-клиент запускает нас процессом и говорит
# через трубы. Это и есть локальный режим — ключ не покидает машину, потому
# что покидать её некуда.
# Досылка хода работы в чат оператора: блокирующий клиент, потому что зовётся
# из той же фоновой задачи, что делает платёж.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rmcp = { version = "2.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-keypair = "3"
# Адрес получателя разбирается ДО начала забора: опечатка, найденная после
# первого доказательства, — это деньги, ушедшие не туда.
solana-pubkey = "3"
solana-rpc-client = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pin thread count before arkworks (parallel feature → rayon).
rayon = "1"
# Ceremony session nonces (public contribute URL ?s=).
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
