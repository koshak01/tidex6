<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 628px;
    font-family: 'Mulish', system-ui, sans-serif;
    background: radial-gradient(120% 100% at 80% 20%, #2a1548 0%, #0d0d0c 55%, #0a0a09 100%);
    color: #f2f0eb;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(153,69,255,.35), transparent 65%);
    right: -80px; top: -120px; filter: blur(8px);
  }
  .glow2 {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20,241,149,.18), transparent 70%);
    left: -100px; bottom: -140px;
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: center; gap: 18px;
  }
  .brand {
    font-size: 22px; letter-spacing: .04em; color: #b8b4ac;
    display: flex; align-items: center; gap: 12px;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: linear-gradient(135deg, #9945FF, #14F195);
  }
  h1 {
    font-size: 72px; font-weight: 700; letter-spacing: -.03em;
    line-height: 1.05; max-width: 14ch;
  }
  .sub {
    font-size: 28px; color: #a3a3a3; font-weight: 500;
  }
  .line {
    width: 120px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, #9945FF, #14F195);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="card">
    <div class="brand"><span class="dot"></span> tidex6</div>
    <h1>Public trusted setup</h1>
    <p class="sub">Solana · open source · 1-of-N honesty</p>
    <div class="line"></div>
  </div>
</body>
</html>
