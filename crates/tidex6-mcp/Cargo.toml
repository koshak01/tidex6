# Свой workspace, не член корневого.
#
# Этот крейт — единственный, кто тянет зависимость ВНЕ репозитория:
# `forge-mcp` из соседнего чекаута кузни. Пока он был членом, `cargo build` в
# чистом клоне падал у любого, у кого рядом нет forge, и по той же причине
# верификатор on-chain программ не мог собрать репозиторий у себя.
[workspace]

[package]
name = "tidex6-mcp"
description = "MCP server exposing tidex6 private payments to AI agents (ADR-018)"
version = "2.17.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ['tidex6 contributors']
repository = "https://github.com/koshak01/tidex6"

[dependencies]
# The MCP server is a thin layer over the SDK — every tool is a wrapper
# around a builder. No cryptography of its own (ADR-018 §1).
tidex6-core = { path = "../tidex6-core" }
tidex6-client = { path = "../tidex6-client" }

anyhow = { version = "1" }
thiserror = { version = "2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"

# MCP protocol. rmcp 2.x is what the collective's other MCP servers run
# on (oculus, mcpa9). No transport feature: this crate is a library, and the
# transport is chosen by whoever mounts it — tidex6-web serves it over
# streamable HTTP at mcp.tidex6.com (ADR-018 §8).
# Ядро даёт гарантированный tool `version` (эпоха деплоя) и bootstrap
# streamable-сервиса. rmcp берём из него же — один экземпляр в графе.
forge-mcp = { path = "../../../forge/crates/forge-mcp" }
rmcp = { version = "2.0", features = ["server", "macros"] }
# Только типы: `http::request::Parts` — то, во что rmcp кладёт HTTP-контекст
# вызова. Через него инструмент узнаёт, чьим токеном его позвали.
http = "1"
schemars = "1.2"

# HTTP-клиент для регистрации платёжного запроса на странице подписи.
# rustls, без OpenSSL — как во всём проекте.
# Адреса кошельков и вывод PDA реестра. Только типы — без RPC-клиента:
# читаем реестр обычным JSON-RPC через reqwest, чтобы не тащить в тонкий
# слой всё дерево anchor-client ради разбора 1216 байт по фиксированным
# смещениям.
solana-pubkey = "3"
base64 = { version = "0.22" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Ceremony MCP Apps session nonces (unguessable correlation id, ceremony-only).
uuid = { version = "1", features = ["v4"] }
